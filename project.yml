name: SensorPlot
options:
  bundleIdPrefix: com.cayla
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  SensorPlot:
    type: application
    platform: iOS
    supportedDestinations: [macCatalyst]
    sources:
      - path: SensorPlot
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cayla.SensorPlot
        PRODUCT_NAME: SensorPlot
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "4"
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "2"
        SUPPORTS_MACCATALYST: YES
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        # Agent-style: Dock/app-switcher stay clear; macOSBridge owns the menu bar item.
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSHomeKitUsageDescription: "SensorPlot reads HomeKit sensor data to record, chart, and export environmental metrics."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "SensorPlot uses your location to fetch local outdoor temperature for the Temperature chart."
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © Cayla"
        CODE_SIGN_ENTITLEMENTS: SensorPlot/SensorPlot.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: QR3XWABHT6
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SDKROOT: iphoneos
    dependencies:
      - target: macOSBridge
        platformFilter: maccatalyst
        embed: true
        codeSign: true
        copyPhase:
          destination: plugins
      - sdk: HomeKit.framework
      - sdk: CoreLocation.framework
    entitlements:
      path: SensorPlot/SensorPlot.entitlements
      properties:
        com.apple.developer.homekit: true
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
        com.apple.security.personal-information.location: true

  # Native AppKit plugin — NSStatusItem lives here (HomeKit stays in Catalyst).
  macOSBridge:
    type: bundle
    platform: macOS
    sources:
      # AppKit-only — do not compile Shared protocols here (cross-module Swift
      # protocol casts break plugin loading). Talk via @objc selectors instead.
      - path: macOSBridge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cayla.SensorPlot.macOSBridge
        PRODUCT_NAME: macOSBridge
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "4"
        INFOPLIST_FILE: macOSBridge/Info.plist
        SKIP_INSTALL: YES
        COMBINE_HIDPI_IMAGES: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: QR3XWABHT6
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SDKROOT: macosx

  SensorPlotTests:
    type: bundle.unit-test
    platform: iOS
    supportedDestinations: [macCatalyst]
    sources:
      - path: SensorPlotTests
    dependencies:
      - target: SensorPlot
      - sdk: HomeKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cayla.SensorPlotTests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "2"
        SUPPORTS_MACCATALYST: YES
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: QR3XWABHT6
        SDKROOT: iphoneos
