name: HomeSensorPlot
options:
  bundleIdPrefix: com.cayla
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  HomeSensorPlot:
    type: application
    platform: iOS
    supportedDestinations: [macCatalyst]
    sources:
      - path: HomeSensorPlot
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cayla.HomeSensorPlot
        PRODUCT_NAME: HomeSensorPlot
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "7"
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "2"
        SUPPORTS_MACCATALYST: YES
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        # Agent-style: Dock/app-switcher stay clear; macOSBridge owns the menu bar item.
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: HomeSensorPlot
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSHomeKitUsageDescription: "HomeSensorPlot reads HomeKit sensor data to record, chart, and export environmental metrics."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "HomeSensorPlot uses your location to fetch local outdoor temperature for the Temperature chart."
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © Cayla"
        CODE_SIGN_ENTITLEMENTS: HomeSensorPlot/HomeSensorPlot.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: QR3XWABHT6
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        SDKROOT: iphoneos
    info:
      path: HomeSensorPlot/Info.plist
      properties:
        # Required to re-open a window after close on Mac Catalyst.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
    dependencies:
      - target: macOSBridge
        platformFilter: maccatalyst
        embed: true
        codeSign: true
        copyPhase:
          destination: plugins
      - sdk: HomeKit.framework
      - sdk: CoreLocation.framework
    entitlements:
      path: HomeSensorPlot/HomeSensorPlot.entitlements
      properties:
        com.apple.developer.homekit: true
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
        com.apple.security.personal-information.location: true

  # Native AppKit plugin — NSStatusItem lives here (HomeKit stays in Catalyst).
  macOSBridge:
    type: bundle
    platform: macOS
    sources:
      # AppKit-only — talk via NotificationCenter; share notification name constants with the host.
      - path: macOSBridge
      - path: Shared/MenuBarNotifications.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cayla.HomeSensorPlot.macOSBridge
        PRODUCT_NAME: macOSBridge
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "7"
        INFOPLIST_FILE: macOSBridge/Info.plist
        SKIP_INSTALL: YES
        COMBINE_HIDPI_IMAGES: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: QR3XWABHT6
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SDKROOT: macosx

  HomeSensorPlotTests:
    type: bundle.unit-test
    platform: iOS
    supportedDestinations: [macCatalyst]
    sources:
      - path: HomeSensorPlotTests
    dependencies:
      - target: HomeSensorPlot
      - sdk: HomeKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cayla.HomeSensorPlotTests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "2"
        SUPPORTS_MACCATALYST: YES
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: QR3XWABHT6
        SDKROOT: iphoneos
